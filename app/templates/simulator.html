<!doctype html><html><head><title>Local Seller Central Simulator</title><style>body{font-family:Arial;max-width:800px;margin:30px auto}input,textarea{display:block;width:100%;margin:8px 0;padding:8px}.hidden{display:none}.card{border:1px solid #ddd;padding:20px}</style></head><body><h1>Seller Central Simulator</h1><div class="card"><label>SKU<input id="sku"></label><label>Title<input id="title"></label><label>Five bullets<textarea id="bullets" rows="7"></textarea></label><label>Operations note<textarea id="note"></textarea></label><button id="save-draft">Save draft</button><p id="saved" class="hidden">Draft saved locally. No Amazon account or publication action occurred.</p></div><script>document.querySelector('#save-draft').onclick=()=>document.querySelector('#saved').classList.remove('hidden')</script></body></html>
