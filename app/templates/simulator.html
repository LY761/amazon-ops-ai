<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Local Seller Central Simulator</title>
  <style>body{font-family:Arial;max-width:800px;margin:30px auto}input,textarea{display:block;width:100%;margin:8px 0;padding:8px}.hidden{display:none}.card{border:1px solid #ddd;padding:20px}</style>
</head>
<body>
  <h1>Seller Central Simulator</h1>
  <div class="card">
    <label>SKU<input id="sku"></label>
    <label>Title<input id="title"></label>
    <label>Five bullets<textarea id="bullets" rows="7"></textarea></label>
    <label>Operations note<textarea id="note"></textarea></label>
    <button id="save-draft">Save draft</button>
    <p id="saved" class="hidden">Draft saved in this local browser.</p>
  </div>
  <script>
    const fields=["sku","title","bullets","note"];
    const saved=document.querySelector("#saved");
    const restored=localStorage.getItem("amazonops-listing-draft");
    if(restored){
      const draft=JSON.parse(restored);
      for(const field of fields)document.querySelector("#"+field).value=draft[field]||"";
      saved.textContent="Persisted local draft restored after page reload.";
      saved.classList.remove("hidden");
    }
    document.querySelector("#save-draft").onclick=()=>{
      const draft={};
      for(const field of fields)draft[field]=document.querySelector("#"+field).value;
      localStorage.setItem("amazonops-listing-draft",JSON.stringify(draft));
      saved.classList.remove("hidden");
    };
  </script>
</body>
</html>
